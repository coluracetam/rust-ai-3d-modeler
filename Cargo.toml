[package]
name = "rust_modeler"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0"
winit = "0.30"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = { version = "0.29", features = ["serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
egui-phosphor = "0.9"
flate2 = "1"
base64 = "0.22"



# The GUI is normally run from target/debug; unoptimised geometry code is 8-20x slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
